# Pac-Man contribution grid animation
# Generates SVGs where Pac-Man eats through the contribution graph.
# Schedule: daily at 00:00 UTC + manual dispatch

name: Pac-Man Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution.svg
            dist/pacman-contribution-dark.svg?palette=github-dark&color_snake=#6C63FF&color_dots=#0d1117,#1a1040,#3b2d8f,#6C63FF,#00D9FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
